<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>PaperX — Good Paper. Better Future. | Circular Sustainable Paper & Recycling</title>
    <meta name="title" content="PaperX — Good Paper. Better Future. | Circular Sustainable Paper & Recycling" />
    <meta name="description" content="PaperX turns waste paper from colleges, schools, offices, and households into premium, affordable recycled notebooks, paper bags, printing paper, and stationery in India." />
    <meta name="keywords" content="recycled paper, sustainable stationery, paper waste recycling India, bulk notebooks, eco-friendly paper bags, circular economy, office paper collection Pune, Maharashtra campus recycling" />
    <meta name="author" content="PaperX" />
    <meta name="theme-color" content="#174D37" />
    <link rel="canonical" href="https://paperx.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://paperx.in/" />
    <meta property="og:title" content="PaperX — Premium Sustainable Paper & Recycling Solutions" />
    <meta property="og:description" content="We give waste paper a second life through thoughtfully made recycled paper products and smarter paper recovery solutions." />
    <meta property="og:site_name" content="PaperX" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://paperx.in/" />
    <meta property="twitter:title" content="PaperX — Premium Sustainable Paper & Recycling Solutions" />
    <meta property="twitter:description" content="We give waste paper a second life through thoughtfully made recycled paper products and smarter paper recovery solutions." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://paperx.in/#organization",
          "name": "PaperX",
          "url": "https://paperx.in",
          "logo": "https://paperx.in/favicon.svg",
          "description": "PaperX is a modern Indian sustainable paper startup transforming waste paper into recycled notebooks, paper bags, and office stationery.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Pune",
            "addressRegion": "Maharashtra",
            "addressCountry": "IN"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "hello@paperx.in"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://paperx.in/#website",
          "url": "https://paperx.in",
          "name": "PaperX",
          "publisher": {
            "@id": "https://paperx.in/#organization"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts Preconnect & Async Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-warm text-charcoal font-sans antialiased selection:bg-leaf/30 selection:text-forest-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
